[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-desk"
version = "0.1.0"
description = "Paper-only, risk-gated Hedge Desk MVP"
requires-python = ">=3.9"

[project.scripts]
hedge-desk = "hedge_desk.cli:main"

[tool.setuptools.packages.find]
include = ["hedge_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

