[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-desk"
version = "0.1.0"
description = "Paper-only, risk-gated Hedge Desk MVP"
requires-python = ">=3.9"

[project.scripts]
hedge-desk = "hedge_desk.cli:main"

[project.optional-dependencies]
test = [
  "coverage[toml]==7.10.7; python_version < '3.10'",
  "coverage==7.16.0; python_version >= '3.10'",
]

[tool.setuptools.packages.find]
include = ["hedge_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["hedge_desk"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
