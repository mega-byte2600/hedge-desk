[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-desk"
version = "0.1.0"
description = "Paper-only, risk-gated Hedge Desk MVP"
requires-python = ">=3.9"
dependencies = [
  "plotly>=5.18",
  "certifi>=2024.2.2",
  "cryptography>=43,<51",
]

[project.scripts]
hedge-desk = "hedge_desk.cli:main"
hedge-desk-web = "hedge_desk.web_app:main"

[project.optional-dependencies]
news = [
  "pwb-toolbox",
]
test = [
  "coverage[toml]==7.10.7; python_version < '3.10'",
  "coverage==7.15.4; python_version >= '3.10'",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["hedge_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["hedge_desk"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
