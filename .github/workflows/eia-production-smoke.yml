name: EIA Production Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eia-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify EIA is LIVE through both Render services
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          bases = (
              "https://hedge-desk2600.onrender.com",
              "https://hedge-desk.onrender.com",
          )

          def get_json(url):
              last = None
              for attempt in range(8):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "hedge-desk-prod-smoke/1.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      last = exc
                      time.sleep(min(5 + attempt * 2, 15))
              raise RuntimeError(f"production endpoint unavailable: {last}")

          failures = []
          for base in bases:
              context = get_json(base + "/api/market-context")
              eia_context = context["sources"]["eia-open-data"]
              if eia_context["status"] != "LIVE" or int(eia_context["observation_count"]) < 1:
                  failures.append((base, "market-context", eia_context))
                  print(f"FAIL {base} /api/market-context: {json.dumps(eia_context, sort_keys=True)}")
                  continue

              status = get_json(base + "/api/data-sources")
              eia = status["sources"]["eia-open-data"]
              if eia["status"] != "LIVE" or int(eia["observation_count"]) < 1:
                  failures.append((base, "data-sources", eia))
                  print(f"FAIL {base} /api/data-sources: {json.dumps(eia, sort_keys=True)}")
                  continue

              observations = eia_context.get("observations") or []
              if not observations:
                  failures.append((base, "market-context-empty", eia_context))
                  continue
              print(f"PASS {base}: EIA LIVE, {eia_context['observation_count']} context rows")

          if failures:
              raise SystemExit(1)
          PY
