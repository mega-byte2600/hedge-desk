name: Overnight Paper Evaluation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overnight-paper-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Run full deterministic evaluation suite
        run: python -m unittest discover -s tests -v
      - name: Produce paper-only morning evaluation
        run: python -m hedge_desk.cli --overnight-report > morning-report.json
      - name: Produce complete synthetic war games
        run: python -m hedge_desk.cli --war-games > war-games.json
      - name: Validate report safety boundary
        run: |
          python -c 'import json; d=json.load(open("morning-report.json")); assert d["complete"] is True; assert d["environment"] == "paper"; assert d["live_orders_enabled"] is False; assert d["summary"]["projects_evaluated"] == 5'
      - uses: actions/upload-artifact@v4
        with:
          name: paper-morning-evaluation-${{ github.run_id }}
          path: |
            morning-report.json
            war-games.json
          retention-days: 30
          if-no-files-found: error
