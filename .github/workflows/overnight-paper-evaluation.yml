name: Overnight Paper Evaluation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overnight-paper-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1d3 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Run full deterministic evaluation suite
        run: python -m unittest discover -s tests -v
      - name: Produce paper-only morning evaluation
        run: python -m hedge_desk.cli --overnight-report > morning-report.json
      - name: Produce complete synthetic war games
        run: python -m hedge_desk.cli --war-games > war-games.json
      - name: Produce human morning control report
        run: python -m hedge_desk.cli --morning-markdown --report-input morning-report.json > morning-report.md
      - name: Validate report safety boundary
        run: |
          python -c 'import json; from pathlib import Path; from hedge_desk.reporting import validate_report; d=json.load(open("morning-report.json")); m=Path("morning-report.md").read_text(); assert d["summary"]["projects_evaluated"] == 5; assert validate_report(d).publishable; assert d["report_sha256"] in m'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-morning-evaluation-${{ github.run_id }}
          path: |
            morning-report.json
            morning-report.md
            war-games.json
          retention-days: 30
          if-no-files-found: error
