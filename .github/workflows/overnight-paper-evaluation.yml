name: Overnight Paper Evaluation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overnight-paper-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEDGE_DESK_CODE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1d3 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Run full deterministic evaluation suite
        run: python -m unittest discover -s tests -v
      - name: Produce paper-only morning evaluation
        run: python -m hedge_desk.cli --overnight-report > morning-report.json
      - name: Produce complete synthetic war games
        run: python -m hedge_desk.cli --war-games > war-games.json
      - name: Produce human morning control report
        run: python -m hedge_desk.cli --morning-markdown --report-input morning-report.json > morning-report.md
      - name: Produce machine-readable validated control summary
        run: python -m hedge_desk.cli --control-summary --report-input morning-report.json > control-summary.json
      - name: Produce scheduler run receipt
        run: python -m hedge_desk.cli --scheduled-receipt --idempotency-key "github-${{ github.run_id }}" --report-input morning-report.json > run-receipt.json
      - name: Verify scheduler run receipt
        run: python -m hedge_desk.cli --verify-scheduled-receipt run-receipt.json
      - name: Persist and verify paper audit journal
        run: |
          python -m hedge_desk.cli --audit-journal audit-journal.jsonl > audit-journal-status.json
          python -m hedge_desk.cli --verify-audit-journal audit-journal.jsonl > audit-journal-verification.json
      - name: Verify latest paper run operational health
        run: python -m hedge_desk.cli --verify-run-health . --maximum-run-age-seconds 900 > operational-health.json
      - name: Build content-addressed artifact bundle
        run: python -m hedge_desk.cli --bundle-manifest morning-report.json morning-report.md control-summary.json run-receipt.json war-games.json audit-journal.jsonl audit-journal-status.json audit-journal-verification.json operational-health.json > bundle-manifest.json
      - name: Verify artifact bundle from disk
        run: python -m hedge_desk.cli --verify-bundle-manifest bundle-manifest.json
      - name: Validate report safety boundary
        run: |
          python -c 'import json, os; from pathlib import Path; from hedge_desk.reporting import validate_report; d=json.load(open("morning-report.json")); s=json.load(open("control-summary.json")); w=json.load(open("war-games.json")); r=json.load(open("run-receipt.json")); b=json.load(open("bundle-manifest.json")); a=json.load(open("audit-journal-verification.json")); h=json.load(open("operational-health.json")); m=Path("morning-report.md").read_text(); assert d["summary"]["projects_evaluated"] == 6; assert validate_report(d).publishable; assert d["code_commit"] == os.environ["GITHUB_SHA"]; assert d["report_sha256"] in m; assert s["report_sha256"] == d["report_sha256"]; assert s["real_trades_executed"] == 0; assert s["real_money_pnl"] == "0"; assert s["live_transition_authorized"] is False; assert d["war_games"] == w; assert r["status"] == "COMPLETE"; assert r["report_sha256"] == d["report_sha256"]; assert a["valid"] is True; assert a["event_count"] == 7; assert h["status"] == "HEALTHY_PAPER"; assert h["live_authorized"] is False; assert len(b["bundle_sha256"]) == 64; assert len(b["files"]) == 9'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-morning-evaluation-${{ github.run_id }}
          path: |
            morning-report.json
            morning-report.md
            control-summary.json
            war-games.json
            run-receipt.json
            audit-journal.jsonl
            audit-journal-status.json
            audit-journal-verification.json
            operational-health.json
            bundle-manifest.json
          retention-days: 30
          if-no-files-found: error
