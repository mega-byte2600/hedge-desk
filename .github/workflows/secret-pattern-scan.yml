name: Secret Pattern Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block common secret patterns
        run: |
          ! grep -RInE "(ghp_|github_pat_|sk-|xox[baprs]-|AKIA|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY)" . \
            --exclude-dir=.git \
            --exclude=schwab.example.json
