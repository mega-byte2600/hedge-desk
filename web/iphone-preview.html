<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emporion iPhone Preview</title>
<style>
:root{--bg:#07111c;--panel:#0c1826;--card:#122235;--line:#26384b;--text:#eef3f7;--muted:#98a8b8;--gold:#c6a15b;--green:#6fb98f;--red:#df7c7c;--orange:#e4a861}*{box-sizing:border-box}body{margin:0;background:#050a10;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:26px}.wrap{text-align:center}.label{font-size:12px;letter-spacing:.13em;color:#91a0ae;margin:0 0 14px}.phone{width:min(393px,94vw);height:min(852px,91vh);min-height:680px;border:1px solid #415064;border-radius:48px;background:var(--bg);box-shadow:0 28px 80px #0008;overflow:hidden;position:relative;text-align:left}.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#000;border-radius:18px;z-index:3}.status{height:50px;padding:15px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.head{padding:6px 20px 14px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--gold);font-weight:800}.brand{font-family:Georgia,serif;font-size:28px;letter-spacing:.05em;margin-top:3px}.tag{font-size:11px;color:var(--muted);margin-top:1px}.screen{height:calc(100% - 145px);overflow:auto;padding:14px 14px 84px}.banner,.card,.row{background:var(--card);border:1px solid var(--line);border-radius:14px}.banner,.card{padding:13px;margin-bottom:10px}.banner strong,.section{font-size:11px;letter-spacing:.08em}.muted{font-size:12px;color:var(--muted);line-height:1.45}.section{font-weight:800;margin:15px 4px 8px}.row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:12px;margin-bottom:8px;color:var(--text);font:inherit;text-align:left;cursor:pointer}.row-title{font-size:14px;font-weight:750}.row-sub{font-size:11px;color:var(--muted);margin-top:3px}.badge{font-size:9px;font-weight:850;border:1px solid var(--line);border-radius:999px;padding:5px 7px;white-space:nowrap}.back{border:0;background:none;color:var(--gold);font:inherit;font-weight:750;padding:5px 0 12px;cursor:pointer}.detail{font-size:23px;font-weight:800;margin-bottom:10px}.tabs{position:absolute;bottom:0;left:0;right:0;background:#091522f2;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 3px 14px}.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:9px;min-height:48px;border-radius:10px;cursor:pointer}.tab b{display:block;font-size:18px;font-weight:500;margin-bottom:2px}.tab.active{background:#18263a;color:var(--text)}textarea,input{width:100%;background:#091522;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;resize:vertical}.gold{color:var(--gold)}.small{font-size:11px;color:var(--muted);margin-top:12px}.homebar{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:125px;height:4px;border-radius:3px;background:#d5dbe2;z-index:4}@media(max-height:760px){.phone{height:94vh}.screen{padding-bottom:72px}.tabs{padding-bottom:9px}}
</style>
</head>
<body>
<div class="stage"><div class="wrap"><p class="label">INTERACTIVE EMPORION iPHONE PRODUCT PREVIEW</p><div class="phone"><div class="island"></div><div class="status"><span>9:41</span><span>5G&nbsp; ▰</span></div><header class="head"><div class="eyebrow">EMPORION · RESEARCH PLATFORM</div><div class="brand">EMPORION</div><div class="tag">Markets · Intelligence · Discipline</div></header><main id="screen" class="screen"></main><nav class="tabs"><button class="tab active" data-tab="desks"><b>▦</b>Desks</button><button class="tab" data-tab="scenarios"><b>⌁</b>Scenarios</button><button class="tab" data-tab="yellow"><b>▤</b>Yellow Sheets</button><button class="tab" data-tab="report"><b>◫</b>Report</button></nav><div class="homebar"></div></div><p class="small">Standalone browser simulation of the current SwiftUI product surface. No live orders.</p></div></div>
<script>
const screen=document.getElementById('screen');const tabs=[...document.querySelectorAll('.tab')];
const desks=[['01','Overnight Premium','Evaluated','HUMAN REVIEW'],['02','Earnings Event','Evaluated','NO TRADE'],['03','Box / Parity Observer','Evaluated','NO TRADE'],['04','Dividend Opportunity','Evaluated','NO TRADE'],['05','Quant / AI Model Lab','Evaluated','NO TRADE'],['06','Futures Event','Evaluated','NO TRADE'],['07','Bonds & Rates','Architecture only','COMING ONLINE']];
function deskList(){screen.innerHTML='<div class="banner"><strong>PAPER RESEARCH</strong><div class="muted" style="margin-top:5px">Seven research desks · Six evaluated workflows<br>Reference research only. No live orders.</div></div><div class="section">RESEARCH DESKS</div>'+desks.map((d,i)=>`<button class="row" data-desk="${i}"><div><div class="row-title">${d[0]} · ${d[1]}</div><div class="row-sub">${d[2]}</div></div><span class="badge">${d[3]}</span></button>`).join('');document.querySelectorAll('[data-desk]').forEach(b=>b.onclick=()=>deskDetail(+b.dataset.desk))}
function deskDetail(i){const d=desks[i];screen.innerHTML=`<button class="back">‹ Research desks</button><div class="detail">${d[1]}</div><div class="card"><div class="section" style="margin:0 0 6px">${i===6?'ARCHITECTURE ONLY':'RESEARCH STATUS'}</div><div class="muted">${i===6?'Rates, bonds, monetary policy, yield curves, duration, spreads, and liquidity. No evaluated signal is published for this desk yet.':'Reference snapshot loaded from the Emporion research engine. Evidence is presented for review, not autonomous instruction.'}</div></div><div class="card"><div class="section" style="margin:0 0 6px">HUMAN CONTROL</div><div class="muted">The user remains the decision maker. Risk and compliance blocks are not overridden by this app.</div></div>`;screen.querySelector('.back').onclick=deskList}
function scenarios(){screen.innerHTML='<div class="banner"><strong>SCENARIO LAB</strong><div class="muted" style="margin-top:5px">Stress assumptions before acting.</div></div><input placeholder="Scenario or reason code" aria-label="Scenario search"><div class="section">REFERENCE SCENARIOS</div>'+['Volatility shock','Gap risk','Liquidity stress','Portfolio stress','Event risk'].map((x,i)=>`<div class="row"><div><div class="row-title">${x}</div><div class="row-sub">Synthetic fixture · Scenario ${i+1}</div></div><span class="badge">REVIEW</span></div>`).join('')}
function yellow(){screen.innerHTML='<div class="banner"><strong>YELLOW SHEETS</strong><div class="muted" style="margin-top:5px">Document why you enter, what invalidates the thesis, why you exit, and what you learned.</div></div><button id="newNote" class="row"><div><div class="row-title">＋ New Yellow Sheet</div><div class="row-sub">Bound to the current research snapshot</div></div><span>›</span></button><div class="section">RECENT RESEARCH</div><div class="row"><div><div class="row-title">Example thesis</div><div class="row-sub">Overnight Premium · Today</div></div><span class="badge">DRAFT</span></div>';document.getElementById('newNote').onclick=()=>{screen.innerHTML='<button class="back">‹ Yellow Sheets</button><div class="detail">New Yellow Sheet</div><div class="card"><div class="section" style="margin:0 0 6px">THESIS</div><textarea rows="3" placeholder="Why is this opportunity interesting?"></textarea></div><div class="card"><div class="section" style="margin:0 0 6px">EVIDENCE</div><textarea rows="3" placeholder="What supports the thesis?"></textarea></div><div class="card"><div class="section" style="margin:0 0 6px">INVALIDATION</div><textarea rows="3" placeholder="What would make the thesis wrong?"></textarea></div><button class="row"><div class="row-title">Save draft</div><span>✓</span></button>';screen.querySelector('.back').onclick=yellow}}
function report(){screen.innerHTML='<div class="banner"><strong>EMPORION</strong><div class="muted" style="margin-top:5px">Independent research and decision-support platform.</div></div><div class="card"><div class="section" style="margin:0 0 6px">SNAPSHOT</div><div class="muted">Paper environment<br>Live orders: Disabled<br>Real trades: 0</div></div><div class="card"><div class="section" style="margin:0 0 6px">PRODUCT MODEL</div><div class="muted">Bring your watchlist. Research it your way. Use the system as built, modify it, or extend your own implementation.</div></div><div class="card"><div class="section" style="margin:0 0 6px">PLATFORM PRINCIPLE</div><strong class="gold">Your choice. Your data. Your money.</strong></div>'}
const views={desks:deskList,scenarios,yellow,report};tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');views[t.dataset.tab]()});deskList();
</script>
</body>
</html>
