<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Emporion Hermes Compass Emblem</title>
<desc id="desc">Metallic gold Hermes profile in a winged helmet over a compass rose on a dark field.</desc>
<defs>
  <radialGradient id="bg" cx="48%" cy="38%" r="68%"><stop offset="0" stop-color="#24180b"/><stop offset=".56" stop-color="#100b06"/><stop offset="1" stop-color="#050505"/></radialGradient>
  <linearGradient id="gold" x1=".08" y1=".05" x2=".92" y2=".95"><stop offset="0" stop-color="#fff0b8"/><stop offset=".16" stop-color="#f5c861"/><stop offset=".36" stop-color="#b87819"/><stop offset=".54" stop-color="#ffd979"/><stop offset=".74" stop-color="#9b5b10"/><stop offset="1" stop-color="#f7c94f"/></linearGradient>
  <linearGradient id="deepGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b4309"/><stop offset=".5" stop-color="#d28d20"/><stop offset="1" stop-color="#5b3007"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".75"/></filter>
</defs>

<circle cx="256" cy="256" r="246" fill="url(#bg)"/>
<circle cx="256" cy="256" r="238" fill="none" stroke="url(#gold)" stroke-width="5"/>
<circle cx="256" cy="256" r="215" fill="none" stroke="#d8982c" stroke-width="2" opacity=".9"/>
<circle cx="256" cy="256" r="197" fill="none" stroke="#8c5a17" stroke-width="2" opacity=".75"/>

<!-- compass geometry -->
<g fill="url(#gold)" stroke="#4f2b08" stroke-width="2" filter="url(#shadow)">
  <path d="M256 24l15 166-15 31-15-31z"/>
  <path d="M488 256l-166 15-31-15 31-15z"/>
  <path d="M256 488l-15-166 15-31 15 31z"/>
  <path d="M24 256l166-15 31 15-31 15z"/>
  <path d="M420 92l-91 123-30 12 12-30z" opacity=".72"/>
  <path d="M420 420l-123-91-12-30 30 12z" opacity=".72"/>
  <path d="M92 420l91-123 30-12-12 30z" opacity=".72"/>
  <path d="M92 92l123 91 12 30-30-12z" opacity=".72"/>
</g>
<g fill="#f4c35b" font-family="Georgia,serif" font-weight="700" font-size="24" text-anchor="middle">
  <text x="256" y="39">N</text><text x="475" y="264">E</text><text x="256" y="493">S</text><text x="36" y="264">W</text>
</g>

<!-- Hermes bust -->
<g filter="url(#shadow)">
  <!-- rear hair and neck -->
  <path d="M202 219c-20 34-17 77 6 101 10 11 11 25 4 43-8 21-6 43 4 65h101c-3-22 2-39 17-52 16-14 31-23 36-51 4-20-5-29-18-37-11-7-18-16-20-28-4-22 5-45 4-64-2-40-33-69-73-69-27 0-47 11-61 27z" fill="url(#deepGold)"/>
  <!-- face -->
  <path d="M234 151c34-15 77-7 98 24 9 14 11 30 7 45l-10 36 30 18c8 5 8 13 0 17l-26 10c0 17-6 31-19 42-14 12-29 14-45 9-14-4-22 2-27 14-7 16-8 37-5 62h-69c2-24 10-47 25-66 9-11 12-24 8-37-7-21-12-39-10-62 3-42 15-84 43-112z" fill="url(#gold)" stroke="#5a3209" stroke-width="4"/>
  <!-- face relief -->
  <path d="M284 223c17-4 32 0 43 10-16-1-27 3-35 11 12 0 22 5 30 14-12-6-24-7-36-3m39 36c8 2 15 2 21-1m-20 21c9 5 19 5 29 0" fill="none" stroke="#6b3b0c" stroke-width="5" stroke-linecap="round"/>
  <path d="M266 247c9 5 16 11 21 19-7 3-12 9-14 17" fill="none" stroke="#70400e" stroke-width="4" stroke-linecap="round"/>
  <!-- cloak -->
  <path d="M146 429c27-56 67-85 116-85 40 0 81 25 112 85z" fill="url(#gold)" stroke="#5b320a" stroke-width="4"/>
  <path d="M175 429c25-34 50-56 76-67m32-7c29 14 52 39 69 74" fill="none" stroke="#815018" stroke-width="6" opacity=".8"/>
</g>

<!-- helmet -->
<g filter="url(#shadow)">
  <path d="M162 223c13-55 45-94 97-113 54-20 107-7 148 31-28 25-61 39-98 43-48 5-93 1-134 12-6 2-10 11-13 27z" fill="url(#gold)" stroke="#563007" stroke-width="5"/>
  <path d="M164 220c60 13 133 10 221-10-41 29-89 41-143 35-34-4-60-12-78-25z" fill="url(#deepGold)" opacity=".86"/>
  <!-- helmet side disc -->
  <circle cx="218" cy="191" r="28" fill="#6d3d0b" stroke="url(#gold)" stroke-width="5"/>
  <path d="M218 171l6 14 15 1-12 9 4 15-13-8-13 8 4-15-12-9 15-1z" fill="url(#gold)"/>
  <!-- wing -->
  <g fill="url(#gold)" stroke="#5d350b" stroke-width="3">
    <path d="M220 145C177 83 124 54 68 58c39 21 67 48 86 81-38-28-74-39-108-32 40 15 72 34 96 58-36-14-67-16-91-7 43 14 79 33 109 58 25-13 46-37 60-71z"/>
    <path d="M112 81c34 16 61 36 81 60M89 112c38 11 69 29 93 52M85 153c34 5 63 18 86 38" fill="none" stroke="#7e4b13" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- upward helmet crest wing -->
  <path d="M258 111c17-45 49-77 95-95-5 23-14 43-28 60 18-9 37-13 56-12-17 20-39 37-66 50-18 8-37 8-57-3z" fill="url(#gold)" stroke="#5d350b" stroke-width="4"/>
</g>

<!-- gold inner rim -->
<circle cx="256" cy="256" r="215" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".55" filter="url(#glow)"/>
</svg>